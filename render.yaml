# Render Blueprint. Как использовать:
#   1. Залейте проект на GitHub.
#   2. В Render: New -> Blueprint -> выберите этот репозиторий.
#   3. Render найдёт этот файл и предложит создать сервисы ниже.
#   4. Заполните секретные переменные окружения (помечены sync: false)
#      в Render Dashboard -> сервис -> Environment.
#   5. После первого деплоя скопируйте публичный URL сервиса tg-campaign-bot
#      (вида https://tg-campaign-bot-xxxx.onrender.com) и впишите его БЕЗ
#      слеша на конце в переменную APP_URL у cron-джобы ниже.
#   6. Deploy.
#
# Подробности - в README.md.

services:
  # Основной бот. type: web - у сервиса есть публичный URL и HTTP health-check
  # (нужно для пинга от cron-джобы, чтобы Render не усыплял сервис). Сам бот
  # общается с Telegram через long polling, HTTP используется только для
  # keep-alive - см. start_health_server() в main.py.
  - type: web
    name: tg-campaign-bot
    env: python
    plan: starter          # платный план: на нём доступен persistent disk
                            # и сервис в принципе не засыпает сам по себе
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true        # автодеплой при пуше в GitHub
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STORAGE_DIR
        value: /var/data
      - key: BROADCAST_DELAY_SECONDS
        value: "2.5"
    disk:
      name: bot-storage
      mountPath: /var/data   # тут хранятся сессии Telethon и база рассылки
      sizeGB: 1

  # Пинг раз в 10 минут, чтобы сервис не "засыпал" (актуально в первую
  # очередь для бесплатных Render-планов - они усыпляют web-сервис после
  # ~15 минут без HTTP-запросов; на платных планах сервис и так не спит,
  # но пинг всё равно безвреден).
  - type: cron
    name: tg-campaign-bot-keepalive
    env: python
    region: frankfurt
    branch: main
    schedule: "*/10 * * * *"   # каждые 10 минут
    buildCommand: "echo no-build-needed"
    startCommand: 'curl -fsS "$APP_URL/health"'
    envVars:
      # Публичный URL сервиса tg-campaign-bot, БЕЗ слеша на конце
      # (Render Dashboard -> сервис tg-campaign-bot -> вверху страницы)
      - key: APP_URL
        sync: false
